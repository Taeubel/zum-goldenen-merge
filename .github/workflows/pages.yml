# Veröffentlicht die Kartengalerie unter https://Taeubel.github.io/zum-goldenen-merge/
name: Kartengalerie

on:
  push:
    branches: [main]
    paths: ["inhalte/**", "tools/karten_bauen.py", "engine/effekte.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          python tools/karten_bauen.py
          cp build/kartenuebersicht.pdf build/print-and-play.pdf build/KARTEN.md build/site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/site
  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
